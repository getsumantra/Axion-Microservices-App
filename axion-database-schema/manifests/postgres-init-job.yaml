apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  namespace: axion-app

spec:
  backoffLimit: 5

  template:
    spec:

      restartPolicy: OnFailure

      containers:
        - name: postgres-init

          image: postgres:16

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: secret-db
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secret-db
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: secret-db
                  key: POSTGRES_DB

            - name: PGHOST
              value: axion-postgres

            - name: PGPORT
              value: "5432"

          command:
            - /bin/bash
            - -c

          args:
            - |
              set -e

              echo "Waiting for PostgreSQL..."

              until pg_isready \
                -h "$PGHOST" \
                -p "$PGPORT" \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB"
              do
                echo "PostgreSQL is not ready..."
                sleep 5
              done

              echo "PostgreSQL is ready."

              export PGPASSWORD="$POSTGRES_PASSWORD"

              echo "Creating telemetry table..."

              psql \
                -h "$PGHOST" \
                -p "$PGPORT" \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" \
                <<'EOF'

              CREATE EXTENSION IF NOT EXISTS pgcrypto;

              CREATE TABLE IF NOT EXISTS telemetry (
                  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),

                  device_id VARCHAR(50) NOT NULL,
                  device_type VARCHAR(20) NOT NULL,
                  refinery_region VARCHAR(50) NOT NULL,

                  timestamp TIMESTAMP NOT NULL,

                  temperature DOUBLE PRECISION NOT NULL,
                  vibration DOUBLE PRECISION NOT NULL,
                  current DOUBLE PRECISION NOT NULL,

                  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
              );

              CREATE INDEX IF NOT EXISTS idx_telemetry_device_id
              ON telemetry(device_id);

              CREATE INDEX IF NOT EXISTS idx_telemetry_timestamp
              ON telemetry(timestamp DESC);

              EOF

              echo "Telemetry table and indexes created successfully."